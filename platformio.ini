[env:esp32dev]
; pioarduino = Arduino-ESP32 3.x, which garnet_web needs (stock
; PlatformIO espressif32 is still 2.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
; Two OTA app slots + the artworks in their own partition (see the file).
board_build.partitions = partitions.csv

; USB uploads also write art/art.bin; `-t uploadart` writes only that.
extra_scripts =
    pre:extra_script.py

monitor_speed = 115200
; The esptool RAM-stub checksum error that once forced --no-stub at
; 115200 is gone with pioarduino's esptool 5.
upload_speed = 921600

lib_deps =
    ZinggJM/GxEPD2
    adafruit/Adafruit GFX Library
    bblanchon/ArduinoJson
    ; Web settings UI + WiFi manager; pulls in garnet_settings. For local
    ; work on it, swap in symlink://../garnet_web (and ../garnet_settings).
    https://github.com/djneo92nl/garnet_web.git#v0.1.0

; Never add lib_ignore here: pioarduino takes it as "remove these IDF
; components" and rewrites the shared framework build script.
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D GARNET_WEB_WIFI
    -D GARNET_WEB_OTA

; Wireless upload once the device is already running and on WiFi (see
; setupOTA() in main.cpp). Requires the OTA_PASSWORD env var, matching
; whatever OTA_PASSWORD is set to in include/secrets.h:
;   OTA_PASSWORD=<your password> pio run -e esp32dev_ota -t upload
; Uses mDNS (OTA_HOSTNAME.local from secrets.h) to find the device, so no
; need to look up its IP -- override with upload_port=<ip> on the command
; line if mDNS resolution doesn't work on your network.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = epaper-dashboard.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
