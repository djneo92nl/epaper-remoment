[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv

; This board hits a known macOS esptool bug uploading the RAM stub
; ("Failed to write to target RAM ... Checksum error"), so we flash via
; --no-stub instead. That needs uncompressed writes, but this platform's
; builder unconditionally hardcodes "-z" (compress) after "write-flash"
; with no --no-stub awareness -- extra_script.py patches that flag in
; place right before upload runs. See extra_script.py for details.
upload_flags =
    --no-stub
extra_scripts =
    pre:extra_script.py

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    ZinggJM/GxEPD2
    adafruit/Adafruit GFX Library
    tzapu/WiFiManager
    bblanchon/ArduinoJson

build_flags =
    -D CORE_DEBUG_LEVEL=3

; Artworks for art mode, generated by tools/convert_art.py.
board_build.embed_files =
    art/art.bin

; Wireless upload once the device is already running and on WiFi (see
; setupOTA() in main.cpp). Requires the OTA_PASSWORD env var, matching
; whatever OTA_PASSWORD is set to in include/secrets.h:
;   OTA_PASSWORD=<your password> pio run -e esp32dev_ota -t upload
; Uses mDNS (OTA_HOSTNAME.local from secrets.h) to find the device, so no
; need to look up its IP -- override with upload_port=<ip> on the command
; line if mDNS resolution doesn't work on your network.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = epaper-remoment.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
